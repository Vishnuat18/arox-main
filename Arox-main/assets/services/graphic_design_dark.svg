<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow_dark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FFFFFF" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="800" fill="#0b0c11"/>
  
  <!-- Subtle Background Grid -->
  <g opacity="0.25" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 8">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
  </g>
  
  <!-- Content Area -->
  
    <circle cx="280" cy="420" r="220" fill="url(#grad_dark)"/>
    
    <!-- Three Overlapping Swatch Cards with Alignment Crosshairs -->
    <!-- Card 1 (Back) -->
    <g transform="translate(120, 200)" opacity="0.7">
      <rect x="0" y="0" width="220" height="300" rx="16" fill="#161822" stroke="#1E293B" stroke-width="2"/>
      <circle cx="110" cy="110" r="50" fill="#1E293B"/>
    </g>
    
    <!-- Card 2 (Middle Primary Accent) -->
    <g transform="translate(180, 260)" filter="url(#shadow_dark)">
      <rect x="0" y="0" width="240" height="320" rx="20" fill="#161822" stroke="#2563eb" stroke-width="2.5"/>
      <rect x="24" y="24" width="192" height="180" rx="12" fill="#2563eb"/>
      <!-- Color Code Label Badge -->
      <rect x="24" y="230" width="100" height="14" rx="4" fill="#FFFFFF"/>
      <rect x="24" y="254" width="140" height="10" rx="3" fill="#C5D3E8" opacity="0.4"/>
      
      <!-- Precise Ruler Marks -->
      <line x1="216" y1="230" x2="216" y2="280" stroke="#1E293B" stroke-width="2"/>
      <line x1="206" y1="230" x2="216" y2="230" stroke="#1E293B" stroke-width="2"/>
      <line x1="210" y1="242" x2="216" y2="242" stroke="#1E293B" stroke-width="2"/>
      <line x1="206" y1="254" x2="216" y2="254" stroke="#1E293B" stroke-width="2"/>
      <line x1="210" y1="266" x2="216" y2="266" stroke="#1E293B" stroke-width="2"/>
      <line x1="206" y1="278" x2="216" y2="278" stroke="#1E293B" stroke-width="2"/>
    </g>
    
    <!-- Alignment Guide Crosshair Icon -->
    <g transform="translate(130, 480)">
      <circle cx="30" cy="30" r="25" fill="none" stroke="#2563eb" stroke-width="2"/>
      <line x1="5" y1="30" x2="55" y2="30" stroke="#2563eb" stroke-width="2"/>
      <line x1="30" y1="5" x2="30" y2="55" stroke="#2563eb" stroke-width="2"/>
      <circle cx="30" cy="30" r="4" fill="#2563eb"/>
    </g>
    
</svg>