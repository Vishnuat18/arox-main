<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow_dark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FFFFFF" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="800" fill="#0b0c11"/>
  
  <!-- Subtle Background Grid -->
  <g opacity="0.25" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 8">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
  </g>
  
  <!-- Content Area -->
  
    <circle cx="300" cy="400" r="230" fill="url(#grad_dark)"/>
    
    <!-- Concentric Protection Perimeter Circles -->
    <g transform="translate(300, 400)">
      <circle cx="0" cy="0" r="210" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 10"/>
      <circle cx="0" cy="0" r="160" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.4"/>
      <circle cx="0" cy="0" r="110" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 6"/>
      
      <!-- Security Shield Lock Emblem -->
      <g filter="url(#shadow_dark)">
        <path d="M 0 -80 L 65 -40 V 30 C 65 75 0 105 0 105 C 0 105 -65 75 -65 30 V -40 Z" fill="#161822" stroke="#2563eb" stroke-width="3.5"/>
        
        <!-- Lock Keyhole Icon -->
        <rect x="-20" y="-10" width="40" height="35" rx="6" fill="#2563eb"/>
        <path d="M -12 -10 V -22 C -12 -32 12 -32 12 -22 V -10" fill="none" stroke="#2563eb" stroke-width="4.5" stroke-linecap="round"/>
        <circle cx="0" cy="4" r="5" fill="#0b0c11"/>
      </g>
    </g>
    
</svg>