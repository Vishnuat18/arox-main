<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow_dark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FFFFFF" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="800" fill="#0b0c11"/>
  
  <!-- Subtle Background Grid -->
  <g opacity="0.25" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 8">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
  </g>
  
  <!-- Content Area -->
  
    <circle cx="300" cy="400" r="220" fill="url(#grad_dark)"/>
    
    <!-- Diagonal Flow: Microservice 1 (Bottom Left) -->
    <g transform="translate(100, 420)" filter="url(#shadow_dark)">
      <rect x="0" y="0" width="180" height="180" rx="20" fill="#161822" stroke="#1E293B" stroke-width="2"/>
      <rect x="25" y="30" width="80" height="12" rx="4" fill="#2563eb"/>
      <rect x="25" y="55" width="130" height="8" rx="3" fill="#C5D3E8" opacity="0.3"/>
      <rect x="25" y="70" width="100" height="8" rx="3" fill="#C5D3E8" opacity="0.3"/>
      <!-- Database lines icon -->
      <ellipse cx="60" cy="125" rx="35" ry="12" fill="none" stroke="#2563eb" stroke-width="2.5"/>
      <path d="M25 125 v20 c0 6.6 15.7 12 35 12 s35 -5.4 35 -12 v-20" fill="none" stroke="#2563eb" stroke-width="2.5"/>
    </g>
    
    <!-- Diagonal Connecting Data Cable & API Plug Node -->
    <path d="M 250 450 Q 300 400 350 350" fill="none" stroke="#2563eb" stroke-width="5" stroke-dasharray="8 6"/>
    
    <!-- Central Glowing API Plug Badge -->
    <g transform="translate(260, 360)" filter="url(#shadow_dark)">
      <circle cx="40" cy="40" r="38" fill="#161822" stroke="#2563eb" stroke-width="3"/>
      <path d="M 28 40 L 40 28 M 40 52 L 52 40" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
      <path d="M 24 24 L 32 32 M 48 48 L 56 56" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    </g>
    
    <!-- Microservice 2 (Top Right) -->
    <g transform="translate(320, 180)" filter="url(#shadow_dark)">
      <rect x="0" y="0" width="180" height="180" rx="20" fill="#161822" stroke="#2563eb" stroke-width="2"/>
      <circle cx="40" cy="40" r="16" fill="#2563eb"/>
      <rect x="70" y="34" width="80" height="12" rx="4" fill="#FFFFFF"/>
      <!-- Code Tags -->
      <path d="M40 100 L25 115 L40 130 M140 100 L155 115 L140 130" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <rect x="55" y="110" width="70" height="10" rx="3" fill="#C5D3E8" opacity="0.4"/>
    </g>
    
</svg>