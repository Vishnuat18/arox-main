<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#155EEF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#155EEF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow_light" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0A1B3F" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="800" fill="#FFFFFF"/>
  
  <!-- Subtle Background Grid -->
  <g opacity="0.4" stroke="#D6E0EF" stroke-width="1" stroke-dasharray="4 8">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
  </g>
  
  <!-- Content Area -->
  
    <circle cx="300" cy="380" r="230" fill="url(#grad_light)"/>
    
    <!-- Floating Minimalist Cloud Outline Above Server Blade Stack -->
    <!-- Server Stack (Bottom) -->
    <g transform="translate(140, 340)" filter="url(#shadow_light)">
      <!-- Server Blade 1 -->
      <rect x="0" y="0" width="320" height="70" rx="14" fill="#F8F9FA" stroke="#D6E0EF" stroke-width="2"/>
      <circle cx="35" cy="35" r="6" fill="#155EEF"/>
      <circle cx="55" cy="35" r="6" fill="#D6E0EF"/>
      <rect x="90" y="30" width="180" height="10" rx="3" fill="#334766" opacity="0.3"/>
      
      <!-- Server Blade 2 -->
      <rect x="0" y="90" width="320" height="70" rx="14" fill="#F8F9FA" stroke="#155EEF" stroke-width="2"/>
      <circle cx="35" cy="125" r="6" fill="#155EEF"/>
      <circle cx="55" cy="125" r="6" fill="#155EEF"/>
      <rect x="90" y="120" width="180" height="10" rx="3" fill="#0A1B3F"/>
      
      <!-- Server Blade 3 -->
      <rect x="0" y="180" width="320" height="70" rx="14" fill="#F8F9FA" stroke="#D6E0EF" stroke-width="2"/>
      <circle cx="35" cy="215" r="6" fill="#155EEF"/>
      <circle cx="55" cy="215" r="6" fill="#D6E0EF"/>
      <rect x="90" y="210" width="180" height="10" rx="3" fill="#334766" opacity="0.3"/>
    </g>
    
    <!-- Cloud Silhouette (Top Centered) -->
    <g transform="translate(300, 220)" filter="url(#shadow_light)">
      <path d="M -70 40 A 45 45 0 0 1 -30 -35 A 60 60 0 0 1 70 -20 A 45 45 0 0 1 80 40 Z" fill="#F8F9FA" stroke="#155EEF" stroke-width="3"/>
      <path d="M -20 10 L 0 -10 L 20 10 M 0 -10 V 25" stroke="#155EEF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    
</svg>