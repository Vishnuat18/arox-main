<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow_dark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FFFFFF" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="800" fill="#0b0c11"/>
  
  <!-- Subtle Background Grid -->
  <g opacity="0.25" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 8">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
  </g>
  
  <!-- Content Area -->
  
    <!-- Soft background glow circle -->
    <circle cx="300" cy="400" r="220" fill="url(#grad_dark)"/>
    
    <!-- Elevated Isometric Card -->
    <g transform="translate(150, 220)" filter="url(#shadow_dark)">
      <rect x="0" y="0" width="300" height="360" rx="20" fill="#161822" stroke="#1E293B" stroke-width="2"/>
      
      <!-- Card Window Header -->
      <line x1="0" y1="48" x2="300" y2="48" stroke="#1E293B" stroke-width="1.5"/>
      <circle cx="30" cy="24" r="5" fill="#2563eb"/>
      <circle cx="48" cy="24" r="5" fill="#1E293B"/>
      <circle cx="66" cy="24" r="5" fill="#1E293B"/>
      
      <!-- Brackets Icon & Code Logic Nodes -->
      <path d="M 90 120 L 60 160 L 60 190 L 40 200 L 60 210 L 60 240 L 90 280" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 210 120 L 240 160 L 240 190 L 260 200 L 240 210 L 240 240 L 210 280" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Logic Nodes & Connection Lines -->
      <line x1="100" y1="170" x2="160" y2="170" stroke="#1E293B" stroke-width="3" stroke-dasharray="4 4"/>
      <line x1="160" y1="170" x2="200" y2="210" stroke="#2563eb" stroke-width="3"/>
      <line x1="100" y1="230" x2="180" y2="230" stroke="#1E293B" stroke-width="3"/>
      
      <circle cx="160" cy="170" r="8" fill="#2563eb"/>
      <circle cx="200" cy="210" r="10" fill="#2563eb"/>
      <circle cx="100" cy="230" r="7" fill="#3b82f6"/>
    </g>
    
</svg>