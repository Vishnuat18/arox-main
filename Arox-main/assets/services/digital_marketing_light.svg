<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#155EEF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#155EEF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow_light" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0A1B3F" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="800" fill="#FFFFFF"/>
  
  <!-- Subtle Background Grid -->
  <g opacity="0.4" stroke="#D6E0EF" stroke-width="1" stroke-dasharray="4 8">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
  </g>
  
  <!-- Content Area -->
  
    <circle cx="320" cy="380" r="230" fill="url(#grad_light)"/>
    
    <!-- Ascending Analytics Chart Container -->
    <g transform="translate(120, 200)" filter="url(#shadow_light)">
      <rect x="0" y="0" width="360" height="420" rx="24" fill="#F8F9FA" stroke="#D6E0EF" stroke-width="2"/>
      
      <!-- Baseline Axis -->
      <line x1="40" y1="350" x2="320" y2="350" stroke="#D6E0EF" stroke-width="2"/>
      
      <!-- Ascending Bars -->
      <rect x="60" y="270" width="45" height="80" rx="8" fill="#D6E0EF"/>
      <rect x="125" y="220" width="45" height="130" rx="8" fill="#D6E0EF"/>
      <rect x="190" y="150" width="45" height="200" rx="8" fill="#175cd3" opacity="0.4"/>
      <rect x="255" y="80" width="45" height="270" rx="8" fill="#155EEF"/>
      
      <!-- Upward Trend Line Arrow -->
      <path d="M 80 250 Q 180 180 275 60" fill="none" stroke="#155EEF" stroke-width="4" stroke-dasharray="6 6"/>
      
      <!-- Dotted Target Bullseye Cursor Emblem at Peak -->
      <g transform="translate(278, 55)">
        <circle cx="0" cy="0" r="24" fill="none" stroke="#155EEF" stroke-width="2"/>
        <circle cx="0" cy="0" r="14" fill="none" stroke="#155EEF" stroke-width="2"/>
        <circle cx="0" cy="0" r="5" fill="#155EEF"/>
      </g>
    </g>
    
</svg>