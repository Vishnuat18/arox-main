<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow_dark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#FFFFFF" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="600" height="800" fill="#0b0c11"/>
  
  <!-- Subtle Background Grid -->
  <g opacity="0.25" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 8">
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
    <line x1="0" y1="600" x2="600" y2="600"/>
  </g>
  
  <!-- Content Area -->
  
    <circle cx="300" cy="420" r="220" fill="url(#grad_dark)"/>
    
    <!-- Minimalist Wireframe Shopping Bag Frame -->
    <g transform="translate(160, 220)" filter="url(#shadow_dark)">
      <rect x="0" y="100" width="280" height="320" rx="24" fill="#161822" stroke="#1E293B" stroke-width="2.5"/>
      
      <!-- Bag Handles -->
      <path d="M 80 100 V 50 C 80 20, 200 20, 200 50 V 100" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
      
      <!-- Bag Content Card -->
      <rect x="30" y="140" width="220" height="120" rx="14" fill="#0b0c11" stroke="#1E293B" stroke-width="1.5"/>
      <rect x="50" y="165" width="100" height="14" rx="4" fill="#FFFFFF"/>
      <rect x="50" y="190" width="70" height="10" rx="3" fill="#C5D3E8" opacity="0.4"/>
      <rect x="180" y="165" width="50" height="20" rx="6" fill="#2563eb"/>
      
      <!-- Elevated Verified Payment Checkmark Node -->
      <g transform="translate(180, 260)" filter="url(#shadow_dark)">
        <circle cx="40" cy="40" r="42" fill="#2563eb"/>
        <path d="M 26 40 L 36 50 L 56 30" fill="none" stroke="#0b0c11" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
    
</svg>