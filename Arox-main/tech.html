<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arox Tech - Technology Stack Showcase</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <meta name="description" content="Award-winning Technology Stack showcase featuring automatic dual-lane icon marquees, React 18, and skeuomorphic design.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Sora:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel for JSX -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* --------------------------------------------------------------------------
       1. Design Tokens & Custom Properties
       -------------------------------------------------------------------------- */
    :root {
      --bg-main: #050505;
      --bg-section: #0B0F19;
      --bg-card: #111827;
      --text-main: #FFFFFF;
      --text-muted: #94A3B8;
      --border-outer: #1E293B;
      --border-bevel: rgba(255, 255, 255, 0.12);
      
      /* Brand Palette */
      --color-orange: #FF6B00;
      --color-gold: #FFB800;
      --color-navy: #0B1F4D;
      --color-blue: #1E5EFF;
      --color-gray: #4E5970;
      
      /* Typography */
      --font-heading: 'Sora', sans-serif;
      --font-body: 'Inter', sans-serif;
      
      /* Easing */
      --ease-tactile: cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .theme-light {
      --bg-main: #FFFFFF;
      --bg-section: #F8FAFC;
      --bg-card: #F1F5F9;
      --text-main: #0B1F4D;
      --text-muted: #64748B;
      --border-outer: #E2E8F0;
      --border-bevel: rgba(0, 0, 0, 0.08);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      transition: background-color 300ms var(--ease-tactile), color 300ms var(--ease-tactile);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-main);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-outer);
      border-radius: 4px;
    }

    /* --------------------------------------------------------------------------
       2. Navbar Styling
       -------------------------------------------------------------------------- */
    /* Glass Navbar Styling (Capsule Design) */
    .arox-navbar {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 1000px;
      height: 72px;
      background: radial-gradient(circle at 50% 0%, rgba(30, 94, 255, 0.2) 0%, rgba(13, 19, 36, 0.65) 75%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      box-shadow: 
        0 10px 40px rgba(0, 0, 0, 0.4), 
        inset 0 1px 0 rgba(255, 255, 255, 0.15),
        0 0 30px rgba(30, 94, 255, 0.1);
      z-index: 1000;
      display: flex;
      align-items: center;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .arox-navbar::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.8), transparent);
      z-index: 2;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.8);
    }

    .nav-container {
      width: 100%;
      padding: 0 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-link {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .brand-dot {
      color: var(--color-orange);
    }

    .nav-links {
      display: flex;
      gap: 28px;
      align-items: center;
    }

    .nav-link {
      font-size: 15px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      transition: color 0.2s, text-shadow 0.2s;
    }

    .nav-link:hover, .nav-link.active {
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
    }

    .nav-actions {
      display: flex;
      align-items: center;
    }

    .btn-glass-cta {
      background: #ffffff;
      color: #050505 !important;
      border: none;
      padding: 10px 24px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-glass-cta:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 16px rgba(255, 255, 255, 0.25);
    }

    .btn-glass-cta:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(180deg, #FF6B00 0%, #D84315 100%);
      color: #FFFFFF;
      border: 1px solid #BF360C;
      border-top: 1px solid #FFCC80;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-secondary {
      background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-section) 100%);
      color: var(--text-main);
      border: 1px solid var(--border-outer);
      border-top: 1px solid var(--border-bevel);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    /* Floating Theme Switcher */
    .theme-toggle-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      z-index: 1000;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid var(--border-outer);
      border-top: 2px solid var(--border-bevel);
      color: var(--text-main);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: transform 200ms ease;
    }
    .theme-toggle-btn:hover {
      transform: scale(1.1) rotate(15deg);
    }
    .theme-dark .sun-icon, :root:not(.theme-light) .sun-icon { display: block; }
    .theme-dark .moon-icon, :root:not(.theme-light) .moon-icon { display: none; }
    .theme-light .sun-icon { display: none; }
    .theme-light .moon-icon { display: block; }

    :root:not(.theme-light) .theme-nextjs-logo {
      filter: invert(1);
    }

    /* --------------------------------------------------------------------------
       3. Slow Automatic Moving Keyframe Animations for Right 60% Icons
       -------------------------------------------------------------------------- */
    @keyframes moveRightSlow {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(0%); }
    }

    @keyframes moveLeftSlow {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }

    .animate-slow-right {
      animation: moveRightSlow 28s linear infinite;
    }

    .animate-slow-left {
      animation: moveLeftSlow 28s linear infinite;
    }

    /* Project Name Typography Style for Left 40% Content */
    .project-name-heading {
      font-family: var(--font-heading);
      font-size: clamp(1.5rem, 2.8vw, 2.5rem);
      font-weight: 700;
      line-height: 1.18;
      letter-spacing: -0.03em;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <!-- ==========================================================================
       NAVBAR
       ========================================================================== -->
  <nav id="navbar" class="arox-navbar" aria-label="Main Navigation">
    <div class="nav-container">
      <div class="nav-brand">
        <a href="index.html" class="brand-link">AROX<span class="brand-dot">.</span></a>
      </div>
      <div class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="servicecard.html" class="nav-link">Services</a>
        <a href="courses.html" class="nav-link">Training</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </div>
      <div class="nav-actions">
        <a href="login.html" class="btn-glass-cta">Login</a>
      </div>
    </div>
  </nav>

  <!-- React Mounting Root -->
  <div id="root"></div>

  <!-- FLOATING THEME SWITCHER -->
  <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle Theme">
    <svg class="sun-icon w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    <svg class="moon-icon w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
  </button>

  <script type="text/babel">

    // --------------------------------------------------------------------------
    // TECH STACK IMAGES FROM ASSETS/IMAGES FOLDER
    // --------------------------------------------------------------------------
    const ROW_1_IMAGES = [
      { name: "React", url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/react/react-original.svg" },
      { name: "Next.js", url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/nextjs/nextjs-original.svg" },
      { name: "TypeScript", url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/typescript/typescript-original.svg" },
      { name: "JavaScript", url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/javascript/javascript-original.svg" },
      { name: "TailwindCSS", url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/tailwindcss/tailwindcss-original.svg" },
      { name: "Figma", url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/figma/figma-original.svg" },
      { name: "Python", url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/python/python-original.svg" },
      { name: "AWS", url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/amazonwebservices/amazonwebservices-original.svg" }
    ];

    const ROW_2_IMAGES = [
      { name: "Node.js", url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/nodejs/nodejs-original.svg" },
      { name: "PostgreSQL", url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/postgresql/postgresql-original.svg" },
      { name: "MongoDB", url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/mongodb/mongodb-original.svg" },
      { name: "MySQL", url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/mysql/mysql-original.svg" },
      { name: "Java", url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/java/java-original.svg" },
      { name: "C#", url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/csharp/csharp-original.svg" },
      { name: "Elixir", url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/elixir/elixir-original.svg" },
      { name: "React", url: "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/react/react-original.svg" }
    ];

    function CleanIconItem({ item }) {
      return (
        <div className="inline-flex items-center gap-3 px-6 py-3.5 mx-3 shrink-0 rounded-full bg-[var(--bg-card)] border border-[var(--border-outer)] hover:border-[var(--color-orange)] transition-all shadow-md duration-300">
          <img 
            src={item.url} 
            alt={item.name} 
            className={`w-8 h-8 object-contain ${item.name === 'Next.js' ? 'theme-nextjs-logo' : ''}`} 
          />
          <span className="text-sm font-semibold tracking-wide text-[var(--text-main)]">{item.name}</span>
        </div>
      );
    }

    // Main App Component
    function App() {
      return (
        <div className="min-h-screen bg-[var(--bg-main)] text-[var(--text-main)] flex items-center justify-center px-6 md:px-12 lg:px-16 pt-24 pb-12 font-sans relative overflow-hidden">
          
          {/* Ambient Background Light */}
          <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-gradient-to-tr from-[#FF6B00]/12 via-transparent to-[#1E5EFF]/12 rounded-full blur-[180px] pointer-events-none"></div>

          {/* DIRECT SCREEN LAYOUT - NO CARDS, NO BOXES, PURE TRANSPARENT PREMIUM SITE DESIGN */}
          <div className="w-full max-w-[1500px] flex flex-col md:flex-row items-center justify-between gap-12 lg:gap-16 z-10 py-6">
            
            {/* LEFT SECTION (40%) - CONTENT DIRECTLY ON SCREEN */}
            <div className="w-full md:w-[40%] space-y-6">
              <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[#FF6B00]/10 border border-[#FF6B00]/30 text-xs font-bold text-[#FF6B00]">
                <span className="w-2 h-2 rounded-full bg-[#FF6B00] animate-pulse"></span>
                TECH STACK
              </div>

              {/* Heading styled with Project Name Typography */}
              <h2 className="project-name-heading">
                Building Modern <br className="hidden md:block"/>Digital Products <br className="hidden md:block"/>with <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#FF6B00] to-[#FFB800]">Industry Standard</span> Tech.
              </h2>

              <p className="text-sm md:text-base text-slate-300 leading-relaxed font-normal max-w-md">
                From frontend frameworks to backend infrastructure, cloud deployment, AI tools and databases, we build with technologies trusted by millions worldwide.
              </p>

              {/* CTA Button */}
              <div className="pt-2">
                <a href="projects.html" className="inline-flex items-center gap-3 px-7 py-3.5 rounded-xl bg-gradient-to-r from-[#FF6B00] to-[#FFB800] text-white font-extrabold text-sm shadow-xl hover:scale-105 transition-transform active:scale-95 group">
                  <span>Explore Projects</span>
                  <span className="group-hover:translate-x-1.5 transition-transform">→</span>
                </a>
              </div>
            </div>


            {/* RIGHT SECTION (60%) - PURE TRANSPARENT CAROUSEL DIRECTLY ON SCREEN WITH FADE MASKS */}
            <div className="w-full md:w-[60%] flex flex-col justify-center gap-8 overflow-hidden relative py-4">
              
              {/* Screen Edge Fade Mask Left */}
              <div className="absolute inset-y-0 left-0 w-24 md:w-36 bg-gradient-to-r from-[var(--bg-main)] via-[var(--bg-main)]/90 to-transparent z-20 pointer-events-none"></div>

              {/* Screen Edge Fade Mask Right */}
              <div className="absolute inset-y-0 right-0 w-24 md:w-36 bg-gradient-to-l from-[var(--bg-main)] via-[var(--bg-main)]/90 to-transparent z-20 pointer-events-none"></div>

              {/* TOP LANE: AUTOMATIC SLOW MOVING RIGHT (→ → → → →) */}
              <div className="overflow-hidden w-full relative py-2">
                <div className="flex items-center animate-slow-right w-max">
                  {[...ROW_1_IMAGES, ...ROW_1_IMAGES, ...ROW_1_IMAGES, ...ROW_1_IMAGES].map((item, idx) => (
                    <CleanIconItem key={idx} item={item} />
                  ))}
                </div>
              </div>

              {/* BOTTOM LANE: AUTOMATIC SLOW MOVING LEFT (← ← ← ← ←) */}
              <div className="overflow-hidden w-full relative py-2">
                <div className="flex items-center animate-slow-left w-max">
                  {[...ROW_2_IMAGES, ...ROW_2_IMAGES, ...ROW_2_IMAGES, ...ROW_2_IMAGES].map((item, idx) => (
                    <CleanIconItem key={idx} item={item} />
                  ))}
                </div>
              </div>

            </div>

          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    const themeToggleBtn = document.getElementById('theme-toggle-btn');
    const storedTheme = localStorage.getItem('arox-theme') || 'dark';
    
    function applyTheme(theme) {
      document.documentElement.classList.remove('theme-light', 'theme-dark');
      document.documentElement.classList.add('theme-' + theme);
      localStorage.setItem('arox-theme', theme);
    }
    applyTheme(storedTheme);

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.classList.contains('theme-light') ? 'light' : 'dark';
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      applyTheme(newTheme);
    });
  </script>
</body>
</html>
