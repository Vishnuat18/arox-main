<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Meta Logo — 3D GPGPU Particle Animation</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #030712;
    --panel: rgba(8, 15, 30, 0.78);
    --text: #e5eefc;
    --muted: #8ea2c5;
  }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--bg); }
  body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
  #app { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; }
  .hud {
    position:fixed; left:20px; top:20px; z-index:10;
    width:min(360px, calc(100vw - 40px));
    padding:16px 16px 14px;
    border:1px solid rgba(255,255,255,.10);
    border-radius:18px;
    background:var(--panel);
    backdrop-filter: blur(18px);
    box-shadow: 0 14px 55px rgba(0,0,0,.38);
  }
  .title { font-weight:700; letter-spacing:.02em; font-size:18px; }
  .sub { margin-top:4px; color:var(--muted); font-size:12px; line-height:1.5; }
  .row { display:grid; grid-template-columns: 84px 1fr 50px; gap:10px; align-items:center; margin-top:12px; }
  label { color:#c7d4ec; font-size:12px; }
  input[type=range] { width:100%; }
  output { text-align:right; color:#b9d2ff; font-variant-numeric: tabular-nums; font-size:12px; }
  .buttons { display:flex; gap:8px; margin-top:14px; }
  button {
    flex:1; border:1px solid rgba(255,255,255,.10); color:#e7f1ff;
    background:rgba(255,255,255,.06); border-radius:10px; padding:10px 12px;
    cursor:pointer; font-weight:600;
  }
  button:hover { background:rgba(255,255,255,.10); }
  .hint { margin-top:10px; color:#7489ae; font-size:11px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <div class="title">Meta · GPGPU Particle Logo</div>
  <div class="sub">Exact uploaded Meta infinity mark · 16,384 particles · GPU GPGPU turbulence</div>

  <div class="row">
    <label for="size">Size</label>
    <input id="size" type="range" min="0.5" max="6" step="0.1" value="2.5">
    <output id="sizeOut">2.5</output>
  </div>
  <div class="row">
    <label for="speed">Speed</label>
    <input id="speed" type="range" min="0.005" max="0.05" step="0.001" value="0.015">
    <output id="speedOut">0.015</output>
  </div>
  <div class="row">
    <label for="noise">Turbulence</label>
    <input id="noise" type="range" min="0" max="1.5" step="0.05" value="0.35">
    <output id="noiseOut">0.35</output>
  </div>

  <div class="buttons">
    <button id="disperse">Disperse</button>
    <button id="align">Align</button>
  </div>
  <div class="hint">Drag to orbit · targets re-form continuously</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

const simScene = new THREE.Scene();

const rtOptions = {
  minFilter: THREE.NearestFilter,
  magFilter: THREE.NearestFilter,
  format: THREE.RGBAFormat,
  type: THREE.FloatType,
  depthBuffer: false,
  stencilBuffer: false,
};
let rtA = new THREE.WebGLRenderTarget(SIZE, SIZE, rtOptions);
let rtB = new THREE.WebGLRenderTarget(SIZE, SIZE, rtOptions);

const simVS = /* glsl */`
varying vec2 vUv;
void main() {
  vUv = uv;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}
`;

const simFS = /* glsl */`
uniform sampler2D tCurr;
uniform sampler2D tTarget;
uniform float uTime;
uniform float uSpeed;
uniform float uNoiseAmp;
uniform float uNoiseFreq;
uniform float uNoiseSpeed;
varying vec2 vUv;

vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }

float snoise(vec3 v) {
  const vec2 C = vec2(1.0/6.0, 1.0/3.0);
  const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);

  vec3 i = floor(v + dot(v, C.yyy));
  vec3 x0 = v - i + dot(i, C.xxx);

  vec3 g = step(x0.yzx, x0.xyz);
  vec3 l = 1.0 - g;
  vec3 i1 = min(g.xyz, l.zxy);
  vec3 i2 = max(g.xyz, l.zxy);

  vec3 x1 = x0 - i1 + C.xxx;
  vec3 x2 = x0 - i2 + C.yyy;
  vec3 x3 = x0 - D.yyy;

  i = mod289(i);

  vec4 p = permute(permute(permute(
    i.z + vec4(0.0, i1.z, i2.z, 1.0))
    + i.y + vec4(0.0, i1.y, i2.y, 1.0))
    + i.x + vec4(0.0, i1.x, i2.x, 1.0));

  float n_ = 0.142857142857;
  vec3 ns = n_ * D.wyz - D.xzx;

  vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
  vec4 x_ = floor(j * ns.z);
  vec4 y_ = floor(j - 7.0 * x_);

  vec4 x = x_ * ns.x + ns.yyyy;
  vec4 y = y_ * ns.x + ns.yyyy;

  vec4 h = 1.0 - abs(x) - abs(y);
  vec4 b0 = vec4(x.xy, y.xy);
  vec4 b1 = vec4(x.zw, y.zw);

  vec4 s0 = floor(b0) * 2.0 + 1.0;
  vec4 s1 = floor(b1) * 2.0 + 1.0;
  vec4 sh = -step(h, vec4(0.0));

  vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
  vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;

  vec3 p0 = vec3(a0.xy, h.x);
  vec3 p1 = vec3(a0.zw, h.y);
  vec3 p2 = vec3(a1.xy, h.z);
  vec3 p3 = vec3(a1.zw, h.w);

  vec4 norm = taylorInvSqrt(vec4(
    dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)
  ));

  p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;

  vec4 m = max(0.6 - vec4(
    dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)
  ), 0.0);
  m = m * m;

  return 42.0 * dot(m*m, vec4(
    dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)
  ));
}

void main() {
  vec4 pos = texture2D(tCurr, vUv);
  vec4 target = texture2D(tTarget, vUv);

  vec3 dir = target.xyz - pos.xyz;
  pos.xyz += dir * uSpeed * (1.0 + target.w * 3.0);

  if (uNoiseAmp > 0.0) {
    float n = snoise(pos.xyz * uNoiseFreq + uTime * uNoiseSpeed);
    pos.x += cos(n * 6.28) * uNoiseAmp * 0.005;
    pos.y += sin(n * 6.28) * uNoiseAmp * 0.005;
    pos.z += sin(n * 3.14) * uNoiseAmp * 0.005;
  }

  gl_FragColor = vec4(pos.xyz, 1.0);
}
`;

const simMaterial = new THREE.ShaderMaterial({
  vertexShader: simVS,
  fragmentShader: simFS,
  uniforms: {
    tCurr: { value: null },
    tTarget: { value: null },
    uTime: { value: 0 },
    uSpeed: { value: 0.015 },
    uNoiseAmp: { value: 0.35 },
    uNoiseFreq: { value: 1.2 },
    uNoiseSpeed: { value: 0.1 }
  }
});
simQuad.material = simMaterial;

/* ---------------------- Particle render setup --------------------- */
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(COUNT * 3);
const uvs = new Float32Array(COUNT * 2);

for (let i = 0; i < COUNT; i++) {
  const x = i % SIZE;
  const y = Math.floor(i / SIZE);
  uvs[i * 2 + 0] = x / SIZE;
  uvs[i * 2 + 1] = y / SIZE;
}
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));

const particleVS = /* glsl */`
uniform sampler2D tPos;
uniform sampler2D tColor;
uniform float uTime;
uniform float uSize;
uniform float uIsDark;
varying vec4 vColor;

void main() {
  vec4 pos = texture2D(tPos, uv);
  vColor = texture2D(tColor, uv);

  vec4 mvPosition = modelViewMatrix * vec4(pos.xyz, 1.0);

  float pulse = 1.0 + sin(uTime * 3.5 + uv.x * 25.0) * 0.15;
  float baseSize = uSize * (uIsDark < 0.5 ? 0.75 : 1.0);

  gl_PointSize = (baseSize * pulse) * (3.0 / -mvPosition.z);
  gl_Position = projectionMatrix * mvPosition;
}
`;

const particleFS = /* glsl */`
varying vec4 vColor;

void main() {
  float d = length(gl_PointCoord - vec2(0.5));
  if (d > 0.5) discard;
  float intensity = pow(1.0 - d * 2.0, 1.25);
  gl_FragColor = vec4(vColor.rgb * 1.5, intensity * vColor.a);
}
`;

const colorTexture = new THREE.DataTexture(
  new Float32Array(COUNT * 4),
  SIZE, SIZE, THREE.RGBAFormat, THREE.FloatType
);
colorTexture.needsUpdate = true;
colorTexture.minFilter = THREE.NearestFilter;
colorTexture.magFilter = THREE.NearestFilter;

const particleMaterial = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: particleVS,
  fragmentShader: particleFS,
  uniforms: {
    tPos: { value: null },
    tColor: { value: colorTexture },
    uTime: { value: 0 },
    uSize: { value: 2.5 },
    uIsDark: { value: 1.0 }
  }
});

const points = new THREE.Points(geometry, particleMaterial);
scene.add(points);

/* ------------------------- Logo -> targets ------------------------ */
function makeLogoTargets(img) {
  const c = document.createElement('canvas');
  c.width = SIZE;
  c.height = SIZE;

  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.clearRect(0, 0, SIZE, SIZE);

  // Preserve the exact Meta logo aspect ratio instead of stretching it
  // into a square. The source image is 223×148.
  const margin = 10;
  const box = SIZE - margin * 2;
  const scale = Math.min(box / img.naturalWidth, box / img.naturalHeight);
  const drawW = img.naturalWidth * scale;
  const drawH = img.naturalHeight * scale;
  const drawX = (SIZE - drawW) * 0.5;
  const drawY = (SIZE - drawH) * 0.5;

  // White background is intentionally drawn by the source image.
  // We will remove it using the near-white pixel rule below.
  ctx.drawImage(img, drawX, drawY, drawW, drawH);

  const pixels = ctx.getImageData(0, 0, SIZE, SIZE).data;
  const targetData = new Float32Array(COUNT * 4);
  const colorData = new Float32Array(COUNT * 4);

  for (let i = 0; i < COUNT; i++) {
    const r = pixels[i * 4 + 0] / 255;
    const g = pixels[i * 4 + 1] / 255;
    const b = pixels[i * 4 + 2] / 255;
    const a = pixels[i * 4 + 3];

    const x = ((i % SIZE) / SIZE - 0.5) * 2.0;
    const y = (0.5 - Math.floor(i / SIZE) / SIZE) * 2.0;

    // IMPORTANT:
    // The uploaded Meta logo has a WHITE background with opaque alpha.
    // Therefore alpha alone would incorrectly turn the whole rectangle
    // into particles. The exact visible Meta shape is selected by
    // removing near-white background pixels.
    const nearWhite = r > 0.90 && g > 0.90 && b > 0.90;
    const active = a > 30 && !nearWhite;

    if (active) {
      // Keep the recognizable Meta infinity silhouette.
      targetData[i * 4 + 0] = x * 1.3;
      targetData[i * 4 + 1] = y * 1.3;
      targetData[i * 4 + 2] = (Math.random() - 0.5) * 0.05;
      targetData[i * 4 + 3] = a / 255;

      // Use the exact sampled blue from the uploaded logo,
      // with only a subtle random brightness shimmer.
      const shimmer = 1.0 + Math.random() * 0.20;
      colorData[i * 4 + 0] = r * shimmer;
      colorData[i * 4 + 1] = g * shimmer;
      colorData[i * 4 + 2] = b * shimmer;
      colorData[i * 4 + 3] = 1.0;
    } else {
      // Ambient background dust cloud, matching the supplied animation spec.
      const radius = 2.5 + Math.random() * 2.0;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);

      targetData[i * 4 + 0] = radius * Math.sin(phi) * Math.cos(theta);
      targetData[i * 4 + 1] = radius * Math.sin(phi) * Math.sin(theta);
      targetData[i * 4 + 2] = radius * Math.cos(phi);
      targetData[i * 4 + 3] = 0.0;

      colorData[i * 4 + 0] = 0.12;
      colorData[i * 4 + 1] = 0.30;
      colorData[i * 4 + 2] = 0.65;
      colorData[i * 4 + 3] = 0.08;
    }
  }

  const target = new THREE.DataTexture(
    targetData, SIZE, SIZE, THREE.RGBAFormat, THREE.FloatType
  );
  const color = new THREE.DataTexture(
    colorData, SIZE, SIZE, THREE.RGBAFormat, THREE.FloatType
  );

  target.minFilter = target.magFilter = THREE.NearestFilter;
  color.minFilter = color.magFilter = THREE.NearestFilter;
  target.needsUpdate = true;
  color.needsUpdate = true;

  return { target, color, data: targetData };
}

function randomSphericalPositions() {
  const data = new Float32Array(COUNT * 4);
  for (let i = 0; i < COUNT; i++) {
    const radius = 2.0 + Math.random() * 3.5;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    data[i*4+0] = radius * Math.sin(phi) * Math.cos(theta);
    data[i*4+1] = radius * Math.sin(phi) * Math.sin(theta);
    data[i*4+2] = radius * Math.cos(phi);
    data[i*4+3] = 1.0;
  }
  return new THREE.DataTexture(data, SIZE, SIZE, THREE.RGBAFormat, THREE.FloatType);
}

function primeRenderTarget(target, tex) {
  const old = simMaterial.uniforms.tTarget.value;
  simMaterial.uniforms.tTarget.value = tex;
  renderer.setRenderTarget(target);
  renderer.render(simScene, simCamera);
  renderer.setRenderTarget(null);
  simMaterial.uniforms.tTarget.value = old;
}

let targetTexture = null;

function setTargetTexture(tex) {
  tex.needsUpdate = true;
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  targetTexture = tex;
  simMaterial.uniforms.tTarget.value = targetTexture;
}

function disperse() {
  const tex = randomSphericalPositions();
  tex.needsUpdate = true;
  primeRenderTarget(rtA, tex);
  tex.dispose();
}

function align() {
  if (targetTexture) primeRenderTarget(rtA, targetTexture);
}

document.getElementById('disperse').addEventListener('click', disperse);
document.getElementById('align').addEventListener('click', align);

const img = new Image();
img.decoding = 'async';
img.onload = () => {
  const result = makeLogoTargets(img);
  result.target.minFilter = result.target.magFilter = THREE.NearestFilter;
  result.color.minFilter = result.color.magFilter = THREE.NearestFilter;
  result.target.needsUpdate = true;
  result.color.needsUpdate = true;

  setTargetTexture(result.target);
  particleMaterial.uniforms.tColor.value = result.color;

  // Initial state: a dispersed cloud, then it naturally aligns.
  disperse();
};
img.src = LOGO_DATA_URI;

/* ---------------------------- Controls ---------------------------- */
const size = document.getElementById('size');
const speed = document.getElementById('speed');
const noise = document.getElementById('noise');

function bindRange(el, out, digits=2) {
  el.addEventListener('input', () => out.textContent = Number(el.value).toFixed(digits));
}
bindRange(size, document.getElementById('sizeOut'), 1);
bindRange(speed, document.getElementById('speedOut'), 3);
bindRange(noise, document.getElementById('noiseOut'), 2);

let dragging = false;
let px = 0, py = 0;
let targetRotation = { x: 0, y: 0 };
let currentRotation = { x: 0, y: 0 };

renderer.domElement.addEventListener('pointerdown', e => {
  dragging = true;
  px = e.clientX; py = e.clientY;
  renderer.domElement.setPointerCapture(e.pointerId);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - px;
  const dy = e.clientY - py;
  px = e.clientX; py = e.clientY;

  // Exact drag sensitivity requested by the supplied prompt.
  targetRotation.x += dy * 0.007;
  targetRotation.y += dx * 0.007;
});
renderer.domElement.addEventListener('pointerup', () => dragging = false);
renderer.domElement.addEventListener('pointercancel', () => dragging = false);

/* ---------------------------- Render loop -------------------------- */
const clock = new THREE.Clock();
let lastTime = 0;
const spinOffset = 0.04; // Meta uses a gentle custom spin.

function animate() {
  requestAnimationFrame(animate);

  const uTime = performance.now() * 0.001;
  const speedValue = Number(speed.value);
  const noiseValue = Number(noise.value);
  const sizeValue = Number(size.value);

  simMaterial.uniforms.uTime.value = uTime;
  simMaterial.uniforms.uSpeed.value = speedValue;
  simMaterial.uniforms.uNoiseAmp.value = noiseValue;
  simMaterial.uniforms.tCurr.value = rtA.texture;
  simMaterial.uniforms.tTarget.value = targetTexture;

  renderer.setRenderTarget(rtB);
  renderer.render(simScene, simCamera);
  renderer.setRenderTarget(null);

  [rtA, rtB] = [rtB, rtA];

  particleMaterial.uniforms.tPos.value = rtA.texture;
  particleMaterial.uniforms.uTime.value = uTime;
  particleMaterial.uniforms.uSize.value = sizeValue;
  particleMaterial.uniforms.uIsDark.value = 1.0;

  currentRotation.x += (targetRotation.x - currentRotation.x) * 0.08;
  currentRotation.y += (targetRotation.y - currentRotation.y) * 0.08;

  points.rotation.x = currentRotation.x;
  points.rotation.y = currentRotation.y + uTime * spinOffset;

  renderer.render(scene, camera);
}

animate();

/* ----------------------------- Resize ----------------------------- */
function resize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', resize);
resize();

/* ------------------------ Capability check ------------------------ */
if (!renderer.capabilities.isWebGL2) {
  console.warn('WebGL2 is recommended for FloatType GPGPU render targets.');
}
</script>
